name: Daily Publish

on:
  schedule:
    # Run daily at 12:00 UTC (approx 8 AM US Eastern or 9 AM during DST depending on date)
    - cron: '0 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm ci

      - name: Run daily publishing script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_WRITER_MODEL: ${{ secrets.OPENAI_WRITER_MODEL }}
          OPENAI_EDITOR_MODEL: ${{ secrets.OPENAI_EDITOR_MODEL }}
          OPENAI_RESEARCH_MODEL: ${{ secrets.OPENAI_RESEARCH_MODEL }}
          OPENAI_THOUGHT_MODEL: ${{ secrets.OPENAI_THOUGHT_MODEL }}
          GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
        run: npm run daily

      - name: Publish daily AI thought
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_THOUGHT_MODEL: ${{ secrets.OPENAI_THOUGHT_MODEL }}
        run: npm run thoughts

      - name: Push commits
        if: always()
        env:
          GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
        run: |
          git config user.name "${GIT_USER_NAME:-github-actions[bot]}"
          git config user.email "${GIT_USER_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
          git add -A
          git diff --cached --quiet || git commit -m "publish: daily article $(date -u +%Y-%m-%d)"
          git push
